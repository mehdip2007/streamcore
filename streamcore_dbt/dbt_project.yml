name: 'streamcore_dbt'
version: '1.0.0'
config-version: 2

# Must match the key in ~/.dbt/profiles.yml
profile: 'streamcore_dbt'

# Where dbt looks for models
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Where dbt writes compiled SQL (useful for debugging)
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# The warehouse is ClickHouse (see macros/postgres_bridge.sql for why).
# Before every run, make sure the streamcore_raw.events bridge table
# exists — dbt's source() calls read through it. Both must be idempotent
# (IF NOT EXISTS) since they run on every single dbt invocation.
on-run-start:
  - "{{ create_raw_events_database() }}"
  - "{{ create_raw_events_bridge_table() }}"

# ============================================================
# Model Configuration
# ============================================================
# This controls how dbt materializes each layer.
#
# MATERIALIZATION TYPES:
#   view       - dbt creates a SQL VIEW (no data stored, query runs live)
#                Fast to build, slow to query. Good for staging.
#
#   table      - dbt creates a full TABLE (data stored, query is fast)
#                Slow to build, fast to query. Good for marts.
#
#   incremental - Only processes NEW rows since last run.
#                 Best for large tables. We'll use this for intermediate.
#
# The hierarchy: project defaults → folder config → model config
# More specific always wins.
# ============================================================

models:
  streamcore_dbt:

    staging:
      # Staging models are views — lightweight, no storage cost.
      # They're just cleaned windows into the raw data.
      +materialized: view
      +schema: streamcore_staging

    intermediate:
      # Intermediate models are tables — they join staging models
      # and the result is worth storing for performance.
      +materialized: table
      +schema: streamcore_intermediate

    marts:
      # Marts are tables — business-ready, queried frequently.
      # Fast query time matters here.
      +materialized: table
      +schema: streamcore_marts
