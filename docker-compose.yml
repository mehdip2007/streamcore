# ============================================================
# StreamCore — Local Development Stack
# ============================================================
# Spins up Kafka, Zookeeper, Kafka UI, and Postgres locally.
# All services use sensible defaults for development.
#
# Usage:
#   docker compose up -d         # Start everything in background
#   docker compose ps            # Check status
#   docker compose logs -f kafka # Tail kafka logs
#   docker compose down          # Stop everything
#   docker compose down -v       # Stop AND wipe data volumes
# ============================================================

services:
  # ----- Zookeeper -----
  # Kafka still requires Zookeeper for cluster coordination
  # in this setup. Newer Kafka versions support KRaft mode
  # (no Zookeeper) — we'll migrate to that in a later iteration.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    platform: linux/amd64
    container_name: streamcore-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Kafka Broker -----
  # Single-broker cluster for local dev.
  # In production you'd run 3+ brokers across availability zones.
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    platform: linux/amd64
    container_name: streamcore-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # 9092 is the EXTERNAL listener — what your laptop apps connect to
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listeners explained:
      #   PLAINTEXT://kafka:29092      — used by other Docker containers
      #   PLAINTEXT_HOST://localhost:9092 — used by apps on your laptop
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single-broker dev settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----- Kafka UI -----
  # Web interface for inspecting topics and messages.
  # Open http://localhost:8080 after `docker compose up`
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    container_name: streamcore-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: streamcore-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ----- Postgres -----
  # Used in Layer 1 as the consumer's destination.
  # We'll move to BigQuery in Layer 5.
  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: streamcore-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-streamcore}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamcore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Airflow -----
  # Batch orchestration (Slice 4). Runs streamcore_dbt on a schedule —
  # this is NOT part of the always-on producer/consumer/Spark pipeline;
  # those keep running regardless of whether Airflow is up.
  #
  # `standalone` initializes the metadata DB, creates a default admin
  # user, and runs the webserver + scheduler in a single process — the
  # simplest way to run Airflow locally. Its metadata tables land in the
  # same Postgres instance/database as the app data, but in the default
  # `public` schema, so they don't collide with streamcore_raw/streamcore_aggregated.
  # The generated admin password is printed on first boot — see:
  #   docker compose logs airflow | grep password
  airflow:
    build: ./airflow
    platform: linux/amd64
    container_name: streamcore-airflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-streamcore}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-streamcore}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Consumed by airflow/profiles/profiles.yml, not by Airflow itself
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-streamcore}
      POSTGRES_USER: ${POSTGRES_USER:-streamcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/profiles:/opt/airflow/dbt_profiles:ro
      - ./streamcore_dbt:/opt/airflow/streamcore_dbt:ro
      - airflow-logs:/opt/airflow/logs
    command: standalone

volumes:
  postgres-data:
  airflow-logs:
