[project]
name = "streamcore"
version = "0.1.0"
description = "The data brain behind a video streaming platform"
authors = [
    { name = "Mehdi Pourhadi", email = "mehdipourhadi90@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "confluent-kafka>=2.5.0",     # Kafka client — official Confluent library
    "pydantic>=2.8.0",             # Data validation & schema definition
    "pydantic-settings>=2.4.0",    # Environment-based config
    "python-dotenv>=1.0.0",        # Load .env files
    "structlog>=24.4.0",           # Structured logging (production-grade)
    "psycopg[binary]>=3.2.0",      # Postgres driver (modern replacement for psycopg2)
    "faker>=28.0.0",               # Generate realistic fake data
    # Pinned below 4.0: streaming/core/spark_session.py hardcodes the
    # spark-sql-kafka connector as a Scala 2.12 / Spark 3.5.0 Maven
    # coordinate. An unconstrained pyspark>=3.5.0 resolves to the latest
    # 4.x, which crashes at stream-read time with a Scala ABI mismatch
    # (NoSuchMethodError on scala.Predef$.wrapRefArray) since 4.x moved
    # to Scala 2.13. Bump both together if you ever upgrade off 3.5.x.
    "pyspark>=3.5.0,<4.0.0",
    "clickhouse-connect>=0.7.0",   # Data quality checks against the ClickHouse warehouse
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",                 # Fast Python linter
    "mypy>=1.11.0",                # Type checking
]
# dbt itself isn't a runtime dependency of the pipeline — it's a
# separate project (streamcore_dbt/) with its own venv-worthy tooling.
# This extra just gives it one documented, pinned install path instead
# of "however you happen to have dbt installed."
dbt = [
    "dbt-clickhouse>=1.8,<1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling can't infer wheel contents automatically here — the project
# name ("streamcore") doesn't match a single top-level package, since the
# code is split across producers/, consumers/, streaming/, and scripts/.
# Without this, `pip install -e ".[dev]"` fails at the metadata step.
[tool.hatch.build.targets.wheel]
packages = ["producers", "consumers", "streaming", "scripts", "quality"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
